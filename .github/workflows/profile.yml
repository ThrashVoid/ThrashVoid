name: Refresh profile artwork
on:
  push:
    branches: [main]
    paths:
      - scripts/build-profile.py
      - .github/workflows/profile.yml
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-artwork
  cancel-in-progress: false
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image reader
        run: python -m pip install Pillow==11.3.0
      - name: Render ASCII portrait
        run: python scripts/build-profile.py
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=%230969da
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2379c0ff
      - name: Save refreshed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ascii-*.svg assets/github-snake*.svg
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Refresh ASCII portrait and contribution snake"
          git pull --rebase origin main
          git push
