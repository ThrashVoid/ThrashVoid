name: Refresh profile artwork
on:
  push:
    branches: [main]
    paths:
      - scripts/build-profile.py
      - assets/portrait-source.png
      - .github/workflows/profile.yml
  pull_request:
    paths:
      - scripts/build-profile.py
      - .github/workflows/profile.yml
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-artwork-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image reader
        run: python -m pip install Pillow==11.3.0
      - name: Render animated profile and statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build-profile.py
      - name: Save refreshed artwork
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/calendar-*.svg assets/portrait-*.svg assets/stats-*.svg data/activity.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Refresh animated calendar, ASCII artwork and contribution stats"
          git pull --rebase origin main
          git push
