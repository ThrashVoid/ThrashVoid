name: Refresh public activity artwork

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public activity and rebuild
        run: node scripts/refresh.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROFILE: Thrash-PRX
      - name: Commit changed artwork
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/arcade.svg data/activity.json)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/arcade.svg data/activity.json
          git commit -m 'Refresh public profile activity artwork'
          git push
